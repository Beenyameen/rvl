name: Build and Publish

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.23.3

      - name: Patch cibuildwheel for rate limits
        shell: python
        run: |
          import pathlib
          import cibuildwheel.util
          import os
          
          path = pathlib.Path(cibuildwheel.util.__file__)
          code = path.read_text(encoding="utf-8")
          
          old_code = "with urllib.request.urlopen(url, context=context) as response:"
          new_code = '''
          import urllib.request as _ur
          req = _ur.Request(url, headers={'Authorization': 'Bearer ' + os.environ.get('GITHUB_TOKEN')} if 'github' in url and os.environ.get('GITHUB_TOKEN') else {})
          with _ur.urlopen(req, context=context) as response:
          '''
          
          if old_code in code:
              path.write_text(code.replace(old_code, new_code.strip()), encoding="utf-8")
              print("Successfully patched cibuildwheel!")
          else:
              print("Could not find the code to patch. It might fail.")

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_SKIP: "pp* cp36-* cp37-*"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
