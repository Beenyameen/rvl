name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.23.3

      - name: Patch cibuildwheel for rate limits
        shell: python
        run: |
          import pathlib
          import cibuildwheel.util
          import os
          import re
          
          path = pathlib.Path(cibuildwheel.util.__file__)
          code = path.read_text(encoding="utf-8")
          
          new_code = re.sub(
              r"^(\s*)with urllib\.request\.urlopen\(url, context=context\) as response:",
              r"\1import urllib.request as _ur\n\1req = _ur.Request(url, headers={'Authorization': 'Bearer ' + os.environ.get('GITHUB_TOKEN')} if 'github' in url and os.environ.get('GITHUB_TOKEN') else {})\n\1with _ur.urlopen(req, context=context) as response:",
              code,
              flags=re.MULTILINE
          )
          
          if new_code != code:
              path.write_text(new_code, encoding="utf-8")
              print("Successfully patched cibuildwheel!")
          else:
              print("Could not find the code to patch. It might fail.")

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse python
        env:
          CIBW_ARCHS_LINUX: "auto aarch64"
          CIBW_ARCHS_WINDOWS: "auto ARM64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_SKIP: "pp*"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./python/wheelhouse/*.whl
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}-root
          path: ./wheelhouse/*.whl
          if-no-files-found: ignore

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: python/dist/*.tar.gz

  build_nuget:
    name: Build NuGet package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./csharp
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Rvl/Rvl.csproj

      - name: Build
        run: dotnet build src/Rvl/Rvl.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack src/Rvl/Rvl.csproj -c Release --no-build --output ./nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./csharp/nupkg/*.nupkg

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  upload_nuget:
    needs: build_nuget
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Push NuGet package
        run: dotnet nuget push ./nupkg/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
